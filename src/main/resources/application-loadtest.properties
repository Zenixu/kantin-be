# ============================================================
# Profil UJI BEBAN (issue #145) — ⚠️ JANGAN dipakai di staging/production.
# ------------------------------------------------------------
# Aktifkan bersama profil local untuk menjalankan skenario k6:
#   SPRING_PROFILES_ACTIVE=local,loadtest ./mvnw spring-boot:run
# Lihat docs/uji-beban-tap.md untuk langkah lengkap.
# ============================================================

# Aktifkan KartuLookupLoadTest (lookup Kartu Tamu nyata) agar tap menembus
# jalur SUKSES — bukan ditolak "kartu tidak dikenal" oleh KartuLookupFallback.
kantin.loadtest.enabled=true

# Matikan rate limit agar 429 tidak mengotori pengukuran latensi jalur sukses.
kantin.rate-limit.enabled=false

# Shim login dev (agar skrip k6 bisa minta token; butuh private-key di-set).
kantin.dev-login.enabled=true
