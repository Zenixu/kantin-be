# ============================================================
# Profil DEMO (issue #163) — ⚠️ JANGAN dipakai di staging/production.
# ------------------------------------------------------------
# Aktifkan bersama profil local agar alur kasir bisa diuji END-TO-END
# (tap -> potong saldo/stok -> tutup sesi -> laporan) tanpa data/keys
# tim SKOOLIA (OPEN-QUESTIONS Q7).
#
#   SPRING_PROFILES_ACTIVE=local,demo ./mvnw spring-boot:run
#
# Langkah lengkap: docs/demo-e2e-kasir.md
# ============================================================

# Aktifkan KartuLookupDemo (lookup Kartu Tamu nyata) agar tap menembus
# jalur SUKSES — bukan ditolak "kartu tidak dikenal" oleh KartuLookupFallback.
# Hanya mengenali Kartu Tamu (data kantin-be); identitas siswa tetap menunggu Q7.
kantin.demo.enabled=true

# Shim login dev (agar FE / curl bisa minta token; butuh private-key di-set).
kantin.dev-login.enabled=true

# Matikan rate limit agar demo tidak terhalang 429 saat mengulang alur.
kantin.rate-limit.enabled=false
