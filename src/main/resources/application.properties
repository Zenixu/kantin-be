spring.application.name=scholia-kantin
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# kantin-be TIDAK punya login sendiri (ADR-0002) — identitas hanya dari JWT.
# Kecualikan UserDetailsServiceAutoConfiguration agar Spring Boot tidak membuat
# user default + mencetak "Using generated security password: ..." di log
# (membingungkan tim & tidak kita pakai).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ============================================================
# SERVER
# ============================================================
server.port=8082
server.address=0.0.0.0
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-post-size=100MB
server.tomcat.max-parameter-count=10000
server.tomcat.max-part-count=200
server.tomcat.connection-timeout=60000

# ============================================================
# DATABASE - PostgreSQL (DB TERPISAH dari admin-be, ADR-0001)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kantin_db?stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Skema dimiliki Flyway - JANGAN biarkan Hibernate mengubah skema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Jakarta

# ============================================================
# FLYWAY - semua perubahan skema = file migrasi baru (CONVENTIONS.md §8)
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# REDIS - cache, blacklist token, rate limit
# ⚠️ DILARANG cache status blokir kartu (PRD §11.11)
# ============================================================
# CATATAN (B23/B27): Redis kini DIPAKAI untuk rate limit (SECURITY.md §7).
# Health check tetap default OFF agar instance dev tanpa Redis tidak DOWN palsu;
# aktifkan (REDIS_HEALTH_ENABLED=true) di staging/produksi.
# ⚠️ Rate limit FAIL-OPEN: bila Redis mati, request tetap dilayani (kantin jalan)
#    — lihat kantin.rate-limit.fail-closed.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# ============================================================
# RATE LIMIT (SECURITY.md §7)
# ============================================================
kantin.rate-limit.enabled=${KANTIN_RATE_LIMIT_ENABLED:true}
kantin.rate-limit.window-seconds=${KANTIN_RATE_LIMIT_WINDOW:60}
kantin.rate-limit.auth-limit=${KANTIN_RATE_LIMIT_AUTH:20}
kantin.rate-limit.sensitive-limit=${KANTIN_RATE_LIMIT_SENSITIVE:60}
kantin.rate-limit.default-limit=${KANTIN_RATE_LIMIT_DEFAULT:600}
kantin.rate-limit.fail-closed=${KANTIN_RATE_LIMIT_FAIL_CLOSED:false}

# Proxy/CDN tepercaya yang boleh mengisi X-Forwarded-For (dipisah koma).
# Kosong = JANGAN percaya XFF (kunci limit pakai IP koneksi langsung) — mencegah
# klien memutar XFF untuk melewati rate limit. Isi IP reverse-proxy di produksi.
kantin.rate-limit.trusted-proxies=${KANTIN_RATE_LIMIT_TRUSTED_PROXIES:}

# ============================================================
# WEBHOOK MASUK (SECURITY.md §5, BUGS-DITEMUKAN B34)
# ------------------------------------------------------------
# /api/webhook/** dibuka `permitAll` (tanpa token user) agar SKOOLIA bisa
# memanggil kantin-be. Autentikasinya adalah VERIFIKASI HMAC-SHA256 + anti-replay
# + allowlist IP (WebhookSignatureFilter). TANPA rahasia di bawah, endpoint
# fail-closed (503) — tidak pernah terbuka karena lupa konfigurasi.
# ============================================================
# Rahasia bersama (shared secret) HMAC-SHA256. WAJIB diisi di produksi lewat
# environment; JANGAN commit nilai asli (AGENTS.md §10). Kosong = webhook ditolak.
kantin.webhook.secret=${KANTIN_WEBHOOK_SECRET:}
# Anti-replay: toleransi jam (detik) untuk X-Webhook-Timestamp. Di luar jendela
# ±toleransi → 401 walau signature sah.
kantin.webhook.tolerance-seconds=${KANTIN_WEBHOOK_TOLERANCE_SECONDS:300}
# Batas ukuran badan request webhook (byte). Lewat batas → 413.
kantin.webhook.max-body-bytes=${KANTIN_WEBHOOK_MAX_BODY_BYTES:1048576}
# Allowlist IP/CIDR pengirim (dipisah koma). Kosong = tidak membatasi (signature
# tetap wajib). Isi bila alamat callback-be/SKOOLIA diketahui tetap.
kantin.webhook.allowed-ips=${KANTIN_WEBHOOK_ALLOWED_IPS:}
# Proxy tepercaya yang boleh mengisi X-Forwarded-For untuk menentukan IP klien
# webhook (anti-spoof, pola sama dengan rate limit). Kosong = jangan percaya XFF.
kantin.webhook.trusted-proxies=${KANTIN_WEBHOOK_TRUSTED_PROXIES:}
# Nama header (boleh diubah bila kontrak SKOOLIA memakai nama lain).
kantin.webhook.header-timestamp=${KANTIN_WEBHOOK_HEADER_TIMESTAMP:X-Webhook-Timestamp}
kantin.webhook.header-signature=${KANTIN_WEBHOOK_HEADER_SIGNATURE:X-Webhook-Signature}
kantin.webhook.header-event-id=${KANTIN_WEBHOOK_HEADER_EVENT_ID:X-Webhook-Id}
# Top-up online (PRD §8.2, INTEGRATIONS §5, issue #37). Kontrak payload
# callback-be belum final (Q4) → nama jenis event & tipe subjek default dibuat
# KONFIGURABEL agar penyesuaian kontrak tak perlu ubah kode. Pencocokan jenis
# event case-insensitive; nilai lain cukup dicatat DIABAIKAN (fail-safe).
kantin.webhook.topup.event-types=${KANTIN_WEBHOOK_TOPUP_EVENT_TYPES:TOPUP_ONLINE_SUKSES,TOPUP_ONLINE}
kantin.webhook.topup.subjek-tipe-default=${KANTIN_WEBHOOK_TOPUP_SUBJEK_TIPE_DEFAULT:SISWA}

# ============================================================
# ENDPOINT INTERNAL (mesin-ke-mesin) — issue #29
# ------------------------------------------------------------
# /api/internal/** dipanggil SKOOLIA (mis. admin-be cek apakah rfid_uid sudah
# dipakai Kartu Tamu — anti-tabrakan UID). Autentikasinya HMAC-SHA256 +
# anti-replay (InternalSignatureFilter), rahasia TERPISAH dari webhook masuk.
# Kosong = endpoint internal ditutup (503, fail-closed).
# ============================================================
kantin.internal.enabled=${KANTIN_INTERNAL_ENABLED:true}
kantin.internal.secret=${KANTIN_INTERNAL_SECRET:}
kantin.internal.tolerance-seconds=${KANTIN_INTERNAL_TOLERANCE_SECONDS:300}
kantin.internal.max-body-bytes=${KANTIN_INTERNAL_MAX_BODY_BYTES:1048576}
kantin.internal.allowed-ips=${KANTIN_INTERNAL_ALLOWED_IPS:}
kantin.internal.trusted-proxies=${KANTIN_INTERNAL_TRUSTED_PROXIES:}
kantin.internal.header-timestamp=${KANTIN_INTERNAL_HEADER_TIMESTAMP:X-Internal-Timestamp}
kantin.internal.header-signature=${KANTIN_INTERNAL_HEADER_SIGNATURE:X-Internal-Signature}

# ============================================================
# OBJECT STORAGE - MinIO/S3 (nota, foto stok)
# ============================================================
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket-name=${MINIO_BUCKET:kantin}
# Basis URL publik untuk berkas yang diunggah (dipakai StorageController).
# Contoh: https://cdn.sekolah.id/kantin/ — bila kosong, respons upload
# mengembalikan path objek apa adanya (tanpa host).
minio.url-final=${MINIO_URL_FINAL:}

# ============================================================
# JWT RS256 - verifikasi token dari admin-be (staf) & mobile-be (ortu)
# kantin-be TIDAK punya login sendiri (ADR-0002). Public key (base64 X.509 DER).
# ============================================================
jwt.admin.public-key=${JWT_ADMIN_PUBLIC_KEY:}
jwt.mobile.public-key=${JWT_MOBILE_PUBLIC_KEY:}
jwt.issuer.admin=${JWT_ISSUER_ADMIN:skoolia-admin}
jwt.issuer.mobile=${JWT_ISSUER_MOBILE:skoolia-mobile}

# Verifikasi issuer (klaim "iss") — token dari issuer lain DITOLAK walau
# signature sah. Default true (aman). Matikan sementara hanya bila token uji
# belum memuat issuer yang sesuai (lihat OPEN-QUESTIONS Q1/Q2).
jwt.verify-issuer=${JWT_VERIFY_ISSUER:true}

# CORS — daftar origin FE yang diizinkan (dipisah koma). JANGAN pakai "*"
# bersamaan dengan kredensial. WAJIB diset eksplisit sebelum production.
kantin.cors.allowed-origins=${KANTIN_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Nama cookie access token (parity admin-be) — untuk klien FE berbasis cookie.
jwt.cookie.name=${JWT_COOKIENAME:skoolia-cookies}

# ============================================================
# SHIM LOGIN DEV (HANYA lokal) - pengganti sementara admin-be
# ------------------------------------------------------------
# kantin-be TIDAK punya login sendiri (ADR-0002); identitas hanya dari JWT
# yang diterbitkan admin-be. Karena admin-be belum dapat dijalankan di mesin
# dev (Q1), shim ini menerbitkan token RS256 LOKAL agar FE <-> BE bisa diuji
# end-to-end tanpa menunggu tim lain.
#
# AMAN untuk produksi: default false. Bila true, endpoint /api/v1/auth/login
# dibuka & token ditandatangani private key lokal (pasangan jwt.admin.public-key).
# JANGAN aktifkan di staging/production.
# ============================================================
kantin.dev-login.enabled=${KANTIN_DEV_LOGIN_ENABLED:false}
kantin.dev-login.issuer=${KANTIN_DEV_LOGIN_ISSUER:skoolia-admin}
kantin.dev-login.ttl-ms=${KANTIN_DEV_LOGIN_TTL_MS:43200000}
# Private key RSA base64 PKCS#8 DER (pasangan jwt.admin.public-key). Kosong =
# shim gagal nyala bila enabled=true. Isi HANYA di application-local.properties
# (untracked) — JANGAN commit nilai asli (AGENTS.md §10).
kantin.dev-login.private-key=${KANTIN_DEV_LOGIN_PRIVATE_KEY:}

# ============================================================
# PROFIL PERANGKAT & POSTUR KEPATUHAN (DEMO, #22/#24)
# ------------------------------------------------------------
# Solusi "seadanya" agar modul tetap jalan tanpa menunggu tim RFID/legal:
#   * #22/Q17 — reader RFID USB kasir diasumsikan SAMA dengan reader Kiosk
#     Presensi (mode keyboard-wedge/HID) sampai tim RFID mengonfirmasi.
#   * #24/Q15 — sistem diperlakukan sebagai DANA TITIPAN CLOSED-LOOP (bukan
#     uang elektronik); tanpa tarik tunai/transfer bebas. Tetap wajib
#     konfirmasi legal sebelum rilis produksi.
# Semua nilai konfigurabel — ubah lewat environment, tanpa ubah kode.
# ============================================================
kantin.profil.reader-sama-dengan-kiosk=${KANTIN_PROFIL_READER_SAMA_KIOSK:true}
kantin.profil.reader-mode=${KANTIN_PROFIL_READER_MODE:KEYBOARD_WEDGE}
kantin.profil.reader-panjang-uid=${KANTIN_PROFIL_READER_PANJANG_UID:10}
kantin.profil.reader-baca-ms=${KANTIN_PROFIL_READER_BACA_MS:150}
kantin.profil.reader-catatan=${KANTIN_PROFIL_READER_CATATAN:Asumsi demo: samakan dengan reader Kiosk Presensi (mode HID keyboard-wedge).}
kantin.profil.model-dana=${KANTIN_PROFIL_MODEL_DANA:DANA_TITIPAN_CLOSED_LOOP}
kantin.profil.uang-elektronik=${KANTIN_PROFIL_UANG_ELEKTRONIK:false}
kantin.profil.tarik-tunai=${KANTIN_PROFIL_TARIK_TUNAI:false}
kantin.profil.transfer-bebas=${KANTIN_PROFIL_TRANSFER_BEBAS:false}
kantin.profil.perlu-konfirmasi-legal=${KANTIN_PROFIL_PERLU_KONFIRMASI_LEGAL:true}
kantin.profil.legal-catatan=${KANTIN_PROFIL_LEGAL_CATATAN:Dana titipan closed-loop (hanya untuk pembelian di kantin sekolah). Tidak ada tarik tunai / transfer bebas. Wajib konfirmasi legal (Q15) sebelum produksi.}

# ============================================================
# AKTIVASI MODUL KANTIN (PRD §10, OPEN-QUESTIONS Q6, issue #19)
# ============================================================
# Penegakan toggle aktivasi modul per sekolah: bila internal-be melaporkan
# aktif=false, seluruh endpoint kantin sekolah itu ditolak 409 (PRD §10).
# FAIL-OPEN: selama kontrak Q6 belum final (status diketahui=false) TIDAK
# memblokir apa pun. Cache Redis TTL pendek; kegagalan Redis juga fail-open.
kantin.aktivasi-modul.enabled=${KANTIN_AKTIVASI_MODUL_ENABLED:true}
kantin.aktivasi-modul.cache-seconds=${KANTIN_AKTIVASI_MODUL_CACHE_SECONDS:60}

# ============================================================
# INTEGRASI SKOOLIA (REST internal) - lihat INTEGRATIONS.md
# Semua panggilan lintas-sistem WAJIB lewat service/integrasi/
# ============================================================
skoolia.admin-be.base-url=${SKOOLIA_ADMIN_BE_URL:http://localhost:8081}
skoolia.mobile-be.base-url=${SKOOLIA_MOBILE_BE_URL:}
skoolia.internal-be.base-url=${SKOOLIA_INTERNAL_BE_URL:}
skoolia.callback-be.base-url=${SKOOLIA_CALLBACK_BE_URL:}
skoolia.http.connect-timeout-ms=2000
skoolia.http.read-timeout-ms=3000

# ============================================================
# ZONA WAKTU - zona sekolah (reset limit 00:00, tutup kasir, laporan)
# ============================================================
# CATATAN Jackson 3 (Spring Boot 4): feature WRITE_DATES_AS_TIMESTAMPS
# sudah DIHAPUS. Jangan set spring.jackson.serialization.write-dates-as-timestamps
# (menyebabkan aplikasi GAGAL START). Serialisasi tanggal default = ISO-8601.
spring.jackson.time-zone=Asia/Jakarta

# ============================================================
# SCHEDULER - tugas berkala (PRD §6.4)
# ============================================================
# Auto-tutup sesi kasir: menutup sesi yang masih TERBUKA padahal harinya lewat.
# Default 23:59 zona kantin. Set enabled=false untuk mematikan (test/dev).
kantin.scheduler.sesi.enabled=${KANTIN_SCHEDULER_SESI_ENABLED:true}
kantin.scheduler.sesi.cron=${KANTIN_SCHEDULER_SESI_CRON:0 59 23 * * *}
# Retry posting Buku Kas tertunggak (issue #33): sesi DITUTUP yang gagal
# diposting (fail-open) dicoba ulang berkala. Default tiap 15 menit.
kantin.scheduler.retry-posting.enabled=${KANTIN_SCHEDULER_RETRY_POSTING_ENABLED:true}
kantin.scheduler.retry-posting.cron=${KANTIN_SCHEDULER_RETRY_POSTING_CRON:0 */15 * * * *}
# Auto-tutup sesi sesuai JAM TUTUP per sekolah (PRD §6.4, §9.1, issue #42).
# Berjalan berkala & menutup sesi HARI INI begitu jam tutup sekolah terlewati
# (default 23:59 bila sekolah belum mengatur). Idempoten.
kantin.scheduler.jam-tutup.enabled=${KANTIN_SCHEDULER_JAM_TUTUP_ENABLED:true}
kantin.scheduler.jam-tutup.cron=${KANTIN_SCHEDULER_JAM_TUTUP_CRON:0 */5 * * * *}

# ============================================================
# BUKU KAS - posting ke admin-be (INTEGRATIONS.md §3)
# ============================================================
# Kategori pos pendapatan kantin (INTEGRATIONS.md §3.3).
kantin.bukukas.kategori-pendapatan=${KANTIN_BUKUKAS_KATEGORI_PENDAPATAN:Pendapatan Kantin}
# Kategori pos belanja stok / barang masuk (PRD §5.1, §7.2).
kantin.bukukas.kategori-belanja-stok=${KANTIN_BUKUKAS_KATEGORI_BELANJA_STOK:Belanja Stok Kantin}
# Kategori pos koreksi/penyesuaian (mis. pembalik barang masuk, INTEGRATIONS.md §3.3).
kantin.bukukas.kategori-penyesuaian=${KANTIN_BUKUKAS_KATEGORI_PENYESUAIAN:Penyesuaian Kantin}
# refModul yang dikirim ke Buku Kas. "KANTIN" = entri masuk default: switch-case
# di admin-be BukuKasService.migrateBukuKas() → isOrphan=false → tidak dihapus.
# Diverifikasi 2026-10-07 dari admin-be kode — tidak perlu admin-be tambah case.
kantin.bukukas.ref-modul=${KANTIN_BUKUKAS_REF_MODUL:KANTIN}

# ============================================================
# NOTIFIKASI ORTU - kirim ke mobile-be (PRD §8.4, INTEGRATIONS.md §6)
# ============================================================
# Endpoint & format push notification mobile-be BELUM FINAL (OPEN-QUESTIONS
# Q5). Karena itu pengiriman diisolasi di belakang NotifikasiPort + fallback
# (fail-open): bila nonaktif/base-url kosong, pengiriman DILEWATI dan
# transaksi/top-up/refund tetap berhasil. Isi base-url setelah Q5 dijawab.
kantin.notifikasi.enabled=${KANTIN_NOTIFIKASI_ENABLED:true}
kantin.notifikasi.base-url=${KANTIN_NOTIFIKASI_BASE_URL:}
kantin.notifikasi.timeout-ms=${KANTIN_NOTIFIKASI_TIMEOUT_MS:2000}

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# ============================================================
# MULTIPART - upload nota (MinIO)
# ============================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
