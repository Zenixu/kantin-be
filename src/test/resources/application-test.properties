# ============================================================
# Konfigurasi khusus TEST
# ------------------------------------------------------------
# Uji integrasi (*IT) memakai Testcontainers: @ServiceConnection
# mengganti datasource ke container PostgreSQL sementara (dan Redis ke
# container Redis), dan Flyway menjalankan migrasi V1..Vn pada container itu.
# Jadi tidak perlu DB/Redis/MinIO lokal — kontainer disediakan otomatis.
# ============================================================

# Redis tidak dipakai di test ledger; matikan agar konteks tak menunggu.
spring.data.redis.repositories.enabled=false

# Retry posting Buku Kas (issue #33) diuji langsung lewat service-nya, bukan
# lewat penjadwal; matikan agar tak berjalan liar selama test.
kantin.scheduler.retry-posting.enabled=false

# Auto-tutup sesuai jam tutup sekolah (issue #42) diuji lewat service-nya,
# bukan penjadwal; matikan agar tak berjalan liar selama test.
kantin.scheduler.jam-tutup.enabled=false

# Flyway tetap aktif agar skema (ledger, trigger append-only) benar-benar diuji.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Log lebih ringkas saat test.
logging.level.org.hibernate.SQL=warn
logging.level.org.testcontainers=warn
