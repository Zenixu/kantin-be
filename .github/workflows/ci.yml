name: CI

# Gerbang mutu per-PR (issue #141).
# WORKFLOW.md §4: "CI harus hijau" — workflow ini yang menegakkannya di GitHub,
# karena Jenkinsfile hanya build & deploy (tanpa stage test).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Batalkan run lama bila branch yang sama di-push ulang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 25 — WAJIB (AGENTS.md §2, CONVENTIONS.md §11: bukan 21/26).
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Tampilkan versi toolchain
        run: ./mvnw --version

      # `verify` menjalankan unit test (Surefire, *Test) DAN integration test
      # (Failsafe, *IT) berbasis Testcontainers. Runner ubuntu GitHub sudah
      # menyediakan Docker, jadi IT ledger/race-condition benar-benar dijalankan.
      - name: Build & Test
        run: ./mvnw -B -ntp verify

      - name: Unggah laporan test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-test
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      # Laporan cakupan JaCoCo (issue #174) — HTML + XML + CSV.
      - name: Unggah laporan cakupan (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-coverage
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ── Gerbang image produksi (issue #215) ──────────────────────────────────
  # Unit/IT di job `test` berjalan di JVM runner (PUNYA font) sehingga TIDAK
  # menangkap bug "font hilang di container" (ekspor Excel → 500). Job ini
  # membangun image produksi lalu memverifikasi font tersedia di dalamnya.
  image:
    name: Verifikasi image produksi (font ekspor)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image produksi
        run: docker build -t kantin-be:ci .

      # Guard #215: Apache POI butuh font untuk ekspor Excel. Bila font hilang,
      # endpoint /api/laporan/ekspor balas 500 ("Fontconfig head is null").
      - name: Pastikan font tersedia di image (guard #215)
        run: |
          docker run --rm --entrypoint sh kantin-be:ci -c '
            set -e
            test -d /usr/share/fonts/dejavu || { echo "FONT DEJAVU HILANG"; exit 1; }
            ls /usr/lib/libfontconfig.so.1 >/dev/null 2>&1 || { echo "FONTCONFIG HILANG"; exit 1; }
            echo "OK: font + fontconfig tersedia di image produksi"
          '
