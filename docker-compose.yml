# ============================================================
# docker-compose.yml - Infrastruktur DEV kantin-be
#   docker compose up -d
#   docker compose ps   # pastikan keduanya healthy
#
# TZ=Asia/Jakarta agar konsisten dengan app (ENVIRONMENT.md §6).
# ============================================================
services:
  postgres:
    image: postgres:18-alpine
    container_name: kantin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kantin_db
      POSTGRES_USER: kantin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kantin_dev}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - kantin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kantin -d kantin_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kantin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Jakarta
    ports:
      - "6379:6379"
    volumes:
      - kantin_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kantin_pgdata:
  kantin_redisdata:
